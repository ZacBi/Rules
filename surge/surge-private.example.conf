[Rule]
# Built-in ruleset: no download, matches RFC1918 / .local / IPv6 link-local (see manual RULE-SET,LAN).
RULE-SET,LAN,DIRECT
# Localhost + registries + learning sites — edit shared/programmerRules.js and run node scripts/build.js to change.
# Remote rulesets: extended-matching applies DOMAIN rules to SNI and HTTP Host when applicable.
