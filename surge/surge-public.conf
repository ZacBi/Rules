美国节点 = url-test, policy-path=__SURGE_POLICY_PATH__, update-interval=86400, policy-regex-filter='美国|US|USA|United\s*States|America|Los\s*Angeles|San\s*Jose|Seattle', url=https://www.gstatic.com/generate_204, interval=300, tolerance=50
英国节点 = url-test, policy-path=__SURGE_POLICY_PATH__, update-interval=86400, policy-regex-filter='英国|UK|United\s*Kingdom|Britain|England|London|Manchester', url=https://www.gstatic.com/generate_204, interval=300, tolerance=50
