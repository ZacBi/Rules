# Generated by scripts/build.js
# Public template for Surge (macOS).
# The public repo should only keep placeholders. Put real subscription conversion endpoints in a private copy.
# A raw base64 AnyTLS airport subscription should be converted privately into a Surge-consumable policy list.

[General]
skip-proxy = 127.0.0.1, localhost, *.local
ipv6 = true
loglevel = notify

[Proxy]
# Fill this in privately with your converted AnyTLS/Surge policy list URL or local file.
机场订阅 = external, policy-path=__SURGE_POLICY_PATH__, update-interval=86400

[Proxy Group]
自动选择 = url-test, policy-path=__SURGE_POLICY_PATH__, update-interval=86400, url=https://www.gstatic.com/generate_204, interval=300, tolerance=50
节点选择 = select, 自动选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 英国节点, 澳洲节点, 马来西亚节点, 阿根廷节点, DIRECT
香港节点 = url-test, policy-path=__SURGE_POLICY_PATH__, update-interval=86400, policy-regex-filter='香港|HK|Hong\s*Kong', url=https://www.gstatic.com/generate_204, interval=300, tolerance=50
台湾节点 = url-test, policy-path=__SURGE_POLICY_PATH__, update-interval=86400, policy-regex-filter='台湾|TW|Taiwan|Taipei', url=https://www.gstatic.com/generate_204, interval=300, tolerance=50
