name: Build dist

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-dist.yml"
      - "policy/**"
      - "scripts/**"
      - "mihomo/ruleset/Cursor.*"
      - "rules/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/build-dist.yml"
      - "policy/**"
      - "scripts/**"
      - "mihomo/ruleset/Cursor.*"
      - "rules/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build generated artifacts
        run: node scripts/build.js

      - name: Check JavaScript syntax
        run: |
          node --check scripts/build.js
          node --check policy/catalog.js
          node --check policy/index.js
          node --check policy/renderers.js
          node --check dist/mihomo/override.js
          node --check dist/mihomo/clash-party.js

      - name: Check whitespace
        run: git diff --check

      - name: Verify generated artifacts on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Commit generated artifacts on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet; then
            echo "Generated artifacts are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/modules/index.json dist/stash/stash.stoverride dist/mihomo/override.js dist/mihomo/clash-party.js dist/surge/module.sgmodule
          git commit -m "chore: update generated policy artifacts [skip ci]"
          git push
