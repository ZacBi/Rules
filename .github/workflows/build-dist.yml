name: Build dist

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-dist.yml"
      - "policy/**"
      - "scripts/**"
      - "tests/**"
      - "dist/**"
      - "mihomo/ruleset/Cursor.*"
      - "rules/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/build-dist.yml"
      - "policy/**"
      - "scripts/**"
      - "tests/**"
      - "dist/**"
      - "mihomo/ruleset/Cursor.*"
      - "rules/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build generated artifacts
        run: node scripts/build.js

      - name: Check JavaScript syntax
        run: |
          node --check scripts/build.js
          node --check scripts/validate-dist.js
          node --check policy/catalog.js
          node --check policy/index.js
          node --check policy/renderers.js
          node --check dist/mihomo/override.js
          node --check dist/mihomo/clash-party.js

      - name: Run tests
        run: node --test

      - name: Validate Quantumult X profile
        run: node scripts/validate-dist.js quantumultx

      - name: Validate Quantumult X Sub-Store addon
        run: node scripts/validate-dist.js quantumultxSubStore

      - name: Validate Surge module
        run: node scripts/validate-dist.js surge

      - name: Validate Stash override
        run: node scripts/validate-dist.js stash

      - name: Validate Mihomo overrides
        run: node scripts/validate-dist.js mihomo

      - name: Check public artifact safety
        run: node scripts/validate-dist.js public

      - name: Check whitespace
        run: git diff --check

      - name: Verify generated artifacts on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Commit generated artifacts on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet; then
            echo "Generated artifacts are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/modules/index.json dist/stash/stash.stoverride dist/mihomo/override.js dist/mihomo/clash-party.js dist/surge/module.sgmodule dist/surge/proxy-groups.dconf dist/surge/proxy-groups.compact.dconf dist/surge/rules.dconf dist/quantumultx/rules.conf dist/quantumultx/sub-store.conf
          git commit -m "chore: update generated policy artifacts [skip ci]"
          git push
