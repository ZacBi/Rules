# Generated by scripts/build.js
# Public template for Clash Mi / Mihomo clients.
# Replace the placeholder subscription URL only in a local private copy.
# Subscription response: airports usually return a body that is Base64 text; decoded lines are share links (ss/vmess/trojan/vless/anytls/…).
# Mihomo type:http proxy-providers fetch that URL and parse standard subscription formats automatically — no extra Base64 decoder option is required.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true

proxy-providers:
  airport:
    type: http
    url: '__MIHOMO_SUBSCRIPTION_URL__'
    path: ./providers/airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: 'https://www.gstatic.com/generate_204'
      interval: 300

proxy-groups:
  - name: '自动选择'
    type: url-test
    use:
      - airport
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '节点选择'
    type: select
    proxies:
      - '自动选择'
      - '香港节点'
      - '台湾节点'
      - '日本节点'
      - '新加坡节点'
      - '美国节点'
      - '英国节点'
      - '澳洲节点'
      - '马来西亚节点'
      - '阿根廷节点'
      - 'DIRECT'
  - name: '香港节点'
    type: url-test
    hidden: true
    use:
      - airport
    filter: '(?i)(香港|HK|Hong\s*Kong)'
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '台湾节点'
