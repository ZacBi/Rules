name: Stash Subscription Nodes Only Routing

desc: Keep only proxies from subscription. Replace proxy-groups, rule-providers and rules; do not add local proxies or DNS overrides.

mode: rule

proxy-groups: #!replace
  - name: 🚀 节点选择
    type: select
    proxies:
      - 🌐 自动选择
      - ♻️ 故障转移
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🇬🇧 英国
      - 🇲🇾 马来西亚
      - 🇦🇺 澳洲
      - 🇦🇷 阿根廷
      - 🌏 亚洲
      - 🌍 欧美
      - 🌐 其他地区
      - DIRECT

  - name: 🌐 自动选择
    type: url-test
    include-all: true
    interval: 300
    lazy: true

  - name: ♻️ 故障转移
    type: fallback
    include-all: true
    interval: 300
    lazy: true

  - name: 🇭🇰 香港
    type: url-test
    include-all: true
    filter: '(?i)(🇭🇰|香港|HK|Hong[\s-]?Kong)'
    interval: 300
    lazy: true

  - name: 🇹🇼 台湾
    type: url-test
    include-all: true
    filter: "(?i)(🇹🇼|台湾|台灣|TW|Taiwan|Taipei)"
    interval: 300
    lazy: true

  - name: 🇸🇬 新加坡
    type: url-test
    include-all: true
    filter: "(?i)(🇸🇬|新加坡|狮城|SG|Singapore)"
    interval: 300
    lazy: true

  - name: 🇺🇸 美国
    type: url-test
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|US|United[\s-]?States|America|Los[\s-]?Angeles|Seattle|San[\s-]?Jose|Silicon[\s-]?Valley|Chicago|New[\s-]?York)'
    interval: 300
    lazy: true

  - name: 🇬🇧 英国
    type: url-test
    include-all: true
    filter: '(?i)(🇬🇧|英国|英國|UK|United[\s-]?Kingdom|Britain|London|Manchester)'
    interval: 300
    lazy: true

  - name: 🇲🇾 马来西亚
    type: url-test
    include-all: true
    filter: '(?i)(🇲🇾|马来西亚|馬來西亞|MY|Malaysia|Kuala[\s-]?Lumpur)'
    interval: 300
    lazy: true

  - name: 🇦🇺 澳洲
    type: url-test
    include-all: true
    filter: "(?i)(🇦🇺|澳洲|澳大利亚|澳大利亞|AU|Australia|Sydney|Melbourne|Perth)"
    interval: 300
    lazy: true

  - name: 🇦🇷 阿根廷
    type: url-test
    include-all: true
    filter: '(?i)(🇦🇷|阿根廷|AR|Argentina|Buenos[\s-]?Aires)'
    interval: 300
    lazy: true

  - name: 🌏 亚洲
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇸🇬 新加坡
      - 🇲🇾 马来西亚
      - 🌐 自动选择
      - DIRECT

  - name: 🌍 欧美
    type: select
    proxies:
      - 🇺🇸 美国
      - 🇬🇧 英国
      - 🇦🇺 澳洲
      - 🌐 自动选择
      - DIRECT

  - name: 🌐 其他地区
    type: select
    proxies:
      - 🇦🇷 阿根廷
      - 🌐 自动选择
      - DIRECT

  - name: 🤖 AI 服务
    type: select
    proxies:
      - 🇺🇸 美国
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🌐 自动选择
      - 🚀 节点选择
      - DIRECT

  - name: 🎬 国际流媒体
    type: select
    proxies:
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇺🇸 美国
      - 🇬🇧 英国
      - 🌐 自动选择
      - 🚀 节点选择
      - DIRECT

  - name: 📲 Telegram
    type: select
    proxies:
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🌐 自动选择
      - 🚀 节点选择
      - DIRECT

  - name: 🍎 Apple
    type: select
    proxies:
      - DIRECT
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇺🇸 美国
      - 🌐 自动选择
      - 🚀 节点选择

  - name: Ⓜ️ Microsoft
    type: select
    proxies:
      - DIRECT
      - 🇺🇸 美国
      - 🌐 自动选择
      - 🚀 节点选择

  - name: 🧰 GitHub
    type: select
    proxies:
      - 🇺🇸 美国
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🌐 自动选择
      - 🚀 节点选择
      - DIRECT

  - name: 🔍 Google
    type: select
    proxies:
      - 🇺🇸 美国
      - 🇸🇬 新加坡
      - 🇹🇼 台湾
      - 🌐 自动选择
      - 🚀 节点选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🌐 自动选择
      - ♻️ 故障转移
      - DIRECT

